<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Academy Blox Script</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-page">

    <div class="login-box">

        <h1>ACADEMY BLOX SCRIPT</h1>

        <p class="subtitle">
            Inicia sesión para acceder a las lecciones.
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="tu@correo.com"
                required
                autocomplete="email"
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Tu contraseña"
                required
                autocomplete="current-password"
            >

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <br>

        <p>
            ¿No tienes cuenta?
            <a href="{{ url_for('register') }}">
                Crear cuenta
            </a>
        </p>

    </div>

</div>

</body>

</html>
