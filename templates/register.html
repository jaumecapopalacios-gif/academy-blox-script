<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta - Academy Blox Script</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>🔥 Crear cuenta</h1>

    <form method="POST">

        <input 
        type="text" 
        name="username" 
        placeholder="Usuario"
        required>

        <input 
        type="email" 
        name="email" 
        placeholder="Correo"
        required>

        <input 
        type="password" 
        name="password" 
        placeholder="Contraseña"
        required>

        <button type="submit">
            Registrarme
        </button>

    </form>

    <p>
        ¿Ya tienes cuenta?
        <a href="/login">
            Iniciar sesión
        </a>
    </p>

</div>

</body>
</html>
