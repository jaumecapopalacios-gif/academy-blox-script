<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Academy Blox Script</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header class="navbar">

    <a class="logo"
       href="{{ url_for('index') }}">
        🔥 Academy Blox Script
    </a>

</header>



<main class="auth-page">

    <div class="auth-card">

        <span class="section-label">
            ACADEMY ACCOUNT
        </span>


        <h1>
            Iniciar sesión
        </h1>


        <p>
            Entra a tu cuenta para acceder
            a la academia.
        </p>


        {% with messages = get_flashed_messages() %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form method="POST">

            <label>
                Usuario o correo
            </label>

            <input
                type="text"
                name="username"
                required
                autocomplete="username"
            >


            <label>
                Contraseña
            </label>

            <input
                type="password"
                name="password"
                required
                autocomplete="current-password"
            >


            <button type="submit"
                    class="btn full">
                Iniciar sesión
            </button>

        </form>


        <p class="auth-footer">

            ¿No tienes cuenta?

            <a href="{{ url_for('register') }}">
                Crear cuenta
            </a>

        </p>

    </div>

</main>


</body>

</html>
