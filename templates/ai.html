<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Academy AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header class="navbar">

    <a class="logo"
       href="{{ url_for('index') }}">
        🤖 Academy AI
    </a>


    <nav>

        <a href="{{ url_for('index') }}">
            Inicio
        </a>

        <a href="{{ url_for('scripts') }}">
            Scripts
        </a>

    </nav>

</header>



<main class="ai-page">

    <section class="ai-interface">

        <span class="section-label">
            ACADEMY AI
        </span>


        <h1>
            Tu asistente de programación
        </h1>


        <p>
            Pregunta sobre Roblox Studio,
            Luau y creación de scripts.
        </p>


        <form method="POST">

            <textarea
                name="message"
                rows="7"
                placeholder="¿Cómo hago un sistema de puertas en Roblox?"
                required>{{ question }}</textarea>


            <button class="btn"
                    type="submit">

                Enviar pregunta

            </button>

        </form>


        {% if response %}

        <div class="ai-response">

            <span class="section-label">
                ACADEMY AI
            </span>


            <p>
                {{ response }}
            </p>

        </div>

        {% endif %}

    </section>

</main>


</body>

</html>
