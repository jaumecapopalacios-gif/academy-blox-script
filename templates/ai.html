<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academy AI - Academy Blox Script</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header class="navbar">

    <div class="logo">
        🤖 Academy AI
    </div>


    <nav>

        <a href="{{ url_for('index') }}">
            Inicio
        </a>


        <a href="{{ url_for('logout') }}">
            Salir
        </a>

    </nav>


</header>




<main class="ai-container">


    <div class="ai-card">


        <h1>
            🤖 Asistente Academy Blox
        </h1>


        <p>
            Pregunta sobre scripts, Roblox Studio o programación.
        </p>



        <form method="POST">


            <textarea
            name="message"
            placeholder="Escribe tu pregunta..."
            rows="5"
            required></textarea>



            <button type="submit">
                Enviar
            </button>


        </form>




        {% if response %}


        <div class="ai-response">


            <h2>
                Respuesta:
            </h2>


            <p>
                {{ response }}
            </p>


        </div>


        {% endif %}



    </div>


</main>




<footer>

<p>
© 2026 Academy Blox Script
</p>

</footer>



</body>

</html>
