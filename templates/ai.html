<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Academy AI
</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header>

<h1>
🤖 Academy AI
</h1>

</header>



<div class="container">


<div class="card">


<h2>
Asistente de Roblox Studio
</h2>


<p>
Pregunta sobre Luau, Roblox Studio o creación de juegos.
</p>



<textarea
id="question"
placeholder="Escribe tu pregunta..."
></textarea>



<button
class="button"
onclick="sendAI()"
>
Preguntar
</button>



<div id="answer" class="card">

Respuesta aparecerá aquí.

</div>


</div>


</div>




<script>


async function sendAI(){


let question =
document.getElementById("question").value;



let answer =
document.getElementById("answer");



answer.innerHTML =
"Pensando...";



let response =
await fetch(
"/ai/chat",
{

method:"POST",

headers:
{
"Content-Type":"application/json"
},

body:
JSON.stringify(
{
question:question
}
)

}

);



let data =
await response.json();



answer.innerHTML =
data.answer;


}


</script>



</body>

</html>
