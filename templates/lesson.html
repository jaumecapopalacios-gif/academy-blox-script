<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ lesson.title }} | Academy Blox Script</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header class="navbar">

    <a class="logo"
       href="{{ url_for('index') }}">
        🔥 Academy Blox Script
    </a>


    <nav>

        <a href="{{ url_for('index') }}">
            Inicio
        </a>

        <a href="{{ url_for('scripts') }}">
            Scripts
        </a>

    </nav>

</header>



<main class="section">


    <article class="lesson-page">

        <span class="lesson-number">
            LECCIÓN {{ lesson.id }}
        </span>


        <span class="tag">
            {{ lesson.category }}
        </span>


        <h1>
            {{ lesson.title }}
        </h1>


        <p class="lesson-description">
            {{ lesson.description }}
        </p>


        <div class="lesson-content">

            {{ lesson.content | safe }}

        </div>


        <a class="btn"
           href="{{ url_for('index') }}">

            ← Volver

        </a>

    </article>


</main>

</body>

</html>
