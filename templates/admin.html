<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Panel Admin - Academy Blox Script
</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header>

<h1>
⚡ CONSOLA ADMINISTRADOR
</h1>

</header>



<div class="container">


<div class="card">

<h2>
Comandos
</h2>


<p>
Escribe comandos de administración:
</p>


<pre>
users
makeadmin correo
delete correo
</pre>



<form method="POST" action="/admin/console">


<input
name="command"
placeholder="Comando"
required
>


<button class="button">
Ejecutar
</button>


</form>


</div>





<div class="card">

<h2>
Usuarios
</h2>


{% for user in users %}


<p>

{{ user.email }}

|

{% if user.is_admin %}

ADMIN

{% else %}

Usuario

{% endif %}

</p>


{% endfor %}


</div>



<a href="/" class="button">
Volver
</a>


</div>


</body>

</html>
