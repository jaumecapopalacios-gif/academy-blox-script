<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academy Blox Script</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header>

    <h1>
        ACADEMY BLOX SCRIPT
    </h1>

</header>



<section class="hero">

    <h2>
        Aprende Roblox Studio desde cero
    </h2>


    <p>
        Usuario conectado:
        <strong>
            {{ user["email"] }}
        </strong>
    </p>


</section>




<section class="lessons">


    <h2>
        Tus lecciones
    </h2>



    {% for lesson in lessons %}


    <div class="card">


        <h3>
            Lección {{ loop.index }}
        </h3>


        <h2>
            {{ lesson["title"] }}
        </h2>


        <p>
            {{ lesson["description"] }}
        </p>


        <a class="button" href="/lesson/{{ loop.index }}">
            ENTRAR
        </a>


    </div>


    {% endfor %}



</section>




<footer>

    <p>
        Academy Blox Script © 2026
    </p>

</footer>


</body>

</html>
