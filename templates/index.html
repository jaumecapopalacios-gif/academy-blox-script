<!DOCTYPE html>
<html>
<head>
<title>Academy Blox Script</title>

<style>
body{
background:#050505;
color:white;
font-family:Arial;
}

.card{
background:#111;
padding:20px;
margin:15px;
border-radius:10px;
border:1px solid cyan;
}

a{
color:cyan;
}
</style>

</head>

<body>

<h1>🔥 Academy Blox Script</h1>

<p>Usuario conectado:</p>

<h3>{{session.get('username')}}</h3>

<a href="/logout">Cerrar sesión</a>

<h2>Lecciones</h2>


{% for lesson in lessons %}

<div class="card">

<h2>{{lesson.title}}</h2>

<p>{{lesson.description}}</p>

<a href="/lesson/{{lesson.id}}">
Entrar
</a>

</div>

{% endfor %}


<br>

<a href="/ai">
🤖 Academy AI
</a>


{% if session.get('is_admin') %}

<br><br>

<a href="/admin">
⚙ Consola Administrador
</a>

{% endif %}


</body>
</html>
